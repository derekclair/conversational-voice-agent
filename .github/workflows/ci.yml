name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: lint + tests (py3.11)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Minimal dependency footprint. The hardware-free tests import only
      # local_tts modules. Of those, button_listener does `from evdev import ...`
      # at module load, so `evdev` is the single third-party runtime dep the
      # suite needs. Everything else the code touches is either stdlib or lazily
      # imported and guarded (pyudev only inside _make_udev_monitor(),
      # opentelemetry only when an OTEL endpoint env is set, and NeMo / LangChain
      # / Piper only inside voice_loop functions that no test calls) — so none of
      # those are installed here.
      #
      # evdev has no manylinux wheel; pip builds it from sdist. That compile needs
      # a C toolchain and the Linux input uapi headers (linux/input.h), both of
      # which are already present on ubuntu-latest (gcc + linux-libc-dev) plus the
      # Python headers from actions/setup-python — so no extra apt packages are
      # required. ruff is pinned so `ruff check .` is deterministic across runs.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "ruff==0.16.2" pytest evdev

      - name: Lint (ruff)
        run: ruff check .

      - name: Run tests
        run: pytest -q
